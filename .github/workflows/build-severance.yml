name: Build Severance Counter APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'severance-counter/**'
      - '.github/workflows/build-severance.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: severance-counter

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses (preinstalled on runner)
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Install required SDK platform & build-tools
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: severance-debug-apk
          path: severance-counter/app/build/outputs/apk/debug/app-debug.apk
